name: CI

on:
  push:
    branches:
      - main
      - develop
      - "deploy/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - "deploy/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GameSaveSync.sln

      - name: Build
        run: dotnet build GameSaveSync.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GameSaveSync.sln --configuration Release --no-build
